<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ===== トークン ===== */
    :root {
      --bp-tablet: 600px;
      --color-primary: #2563eb;
      --color-danger: #dc2626;
      --color-org: #ee7800;
      --color-total: #c00;
      --color-text: #222;
      --color-muted: #888;
      --color-bg: #f4f5f7;
      --color-surface: #fff;
      --color-border: #cbd5e1;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, .1);
      --radius: 6px;
      --container-max: 720px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== ベース：モバイル（〜599px）===== */
    html { overflow-x: hidden; }
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
    }
    em { font-style: normal; }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 10px 240px;
    }

    h1 {
      background-color: #efefef;
      font-size: 16px;
      text-align: center;
      padding: 5px 0;
      margin-bottom: 14px;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }

    button {
      font-size: 15px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      background: var(--color-primary);
      color: #fff;
      flex: 1;
    }
    button.reset { background: var(--color-danger); }
    button:active { opacity: .85; }

    .case-select { display: flex; gap: 8px; margin-bottom: 12px; }
    .case-select label {
      flex: 1;
      text-align: center;
      padding: 10px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      background: var(--color-surface);
      font-weight: 600;
      transition: .15s;
    }
    .case-select input { display: none; }
    .case-select label:has(input:checked) {
      border-color: var(--color-primary);
      background: #eff6ff;
      color: var(--color-primary);
    }

    /* 中型介入チェックボックス（対象区分かつ設定済みのみ表示）*/
    .intervention {
      display: none;
      margin-bottom: 16px;
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
    }
    .intervention.show { display: block; }
    .intervention label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .intervention input[type="checkbox"] { width: 20px; height: 20px; }
    .intervention .amt {
      color: var(--color-danger);
      font-size: 13px;
      margin-left: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    th, td {
      padding: 8px 5px;
      text-align: right;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    th:first-child, td:first-child { text-align: left; }
    thead th { background: #eef2ff; font-size: 13px; }
    td.name { font-weight: 600; }

    input[type="number"] {
      width: 60px;
      padding: 6px;
      font-size: 16px; /* iOS：16px未満は不可 */
      text-align: right;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }
    input[type="number"]:focus { border-color: var(--color-primary); outline: none; }

    .subtotal-cell { min-width: 10em; }

    .name .unit-price {
      display: block;
      font-weight: 400;
      font-size: 11px;
      color: var(--color-muted);
      margin-top: 2px;
    }

    .col-price { display: none; }

    .empty-note { text-align: center; color: #999; font-size: 13px; padding: 16px; }

    .result {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: var(--color-surface);
      padding: 10px 10px 5px;
      box-shadow: var(--shadow-card);
    }
    .tool-bar { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-bottom: 10px; }
    .readme { text-align: center; font-size: 12px; }
    .readme-link {
      font-size: 13px;
      color: var(--color-muted);
      text-decoration: underline;
      cursor: pointer;
    }
    .result-row { display: flex; justify-content: space-between; }
    .result-row.total {
      font-size: 18px;
      font-weight: 700;
      border-top: 2px solid var(--color-text);
    }
    .result-row .label { color: #555; }
    .rate-note { font-size: 12px; color: var(--color-muted); margin-top: 4px; text-align: right; }
    #org { color: var(--color-org); }
    #total { color: var(--color-total); }

    /* ===== タブレット／PC（600px〜）===== */
    @media (min-width: 600px) {
      h1 { font-size: 18px; margin-bottom: 16px; }
      button { flex: 0 0 auto; }
      th, td { padding: 10px 8px; font-size: 15px; }
      thead th { font-size: 13px; }
      input[type="number"] { width: 72px; padding: 8px; font-size: 15px; }
      .result { padding: 16px; }
      .result-row, .rate-note, .tool-bar { max-width: var(--container-max); margin: 0 auto; }
      .tool-bar { margin-bottom: 10px; }
      .result-row.total { font-size: 20px; }
      .col-price { display: table-cell; }
      .name .unit-price { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="appTitle">闇医者お会計ツール</h1>

    <!-- 区分ラジオは cases から動的生成 -->
    <div class="case-select" id="caseSelect"></div>

    <!-- 中型介入（対象区分かつ設定済みのみ表示。ラベルも動的）-->
    <div class="intervention" id="intervention">
      <label>
        <input type="checkbox" id="interventionCheck">
        <span id="interventionLabel">中型介入</span>
        <span class="amt" id="interventionAmt"></span>
      </label>
    </div>

    <form id="calcForm">
      <table>
        <thead>
          <tr><th>商品</th><th class="col-price">単価</th><th>個数</th><th>小計</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </form>

    <div class="result">
      <div class="tool-bar">
        <button type="button" class="reset" id="resetBtn">リセット</button>
      </div>
      <div class="result-row"><span class="label">小計</span><span id="subtotal">¥0</span></div>
      <div class="result-row"><span class="label">組織入金額</span><span id="org">¥0</span></div>
      <div class="result-row"><span class="label">取り分</span><span id="share">¥0</span></div>
      <div class="result-row total"><span class="label">請求金額</span><span id="total">¥0</span></div>
      <div class="rate-note" id="rateNote"></div>
      <div class="readme">《<a class="readme-link" id="readmeLink" target="_blank" rel="noopener">README</a>》</div>
    </div>
  </div>

  <!-- 区分ラジオのテンプレート -->
  <template id="caseTemplate">
    <label>
      <input type="radio" name="case">
      <span class="case-label"></span>（<em class="case-rate"></em>）
    </label>
  </template>

  <!-- 行テンプレート（renderRowsで複製）-->
  <template id="rowTemplate">
    <tr>
      <td class="name"><span class="name-text"></span><span class="unit-price"></span></td>
      <td class="col-price price-text"></td>
      <td>
        <input type="number" min="0" step="1" value="0" inputmode="numeric" pattern="[0-9]*">
      </td>
      <td class="subtotal-cell">¥0</td>
    </tr>
  </template>

  <script>
  (function () {
    'use strict';

    /* ===== 状態（すべてサーバー由来のデータで駆動）===== */
    let CASES = [];            // [{id,label,rate}]
    let PRODUCTS = [];         // [{name,price,views:[id,...]}]
    let INTERVENTION = { enabled: false, amount: 0, caseId: '', label: '' };
    let DEFAULT_TITLE = '闇医者お会計ツール';

    // 個数を商品インデックスで保持（区分切替で行が入れ替わっても値を維持）
    const QTY = {};
    // 区分idごとの rate を引くためのマップ
    let RATE_BY_CASE = {};

    /* ===== DOM参照キャッシュ ===== */
    const el = {
      appTitle:         document.getElementById('appTitle'),
      caseSelect:       document.getElementById('caseSelect'),
      caseTemplate:     document.getElementById('caseTemplate'),
      rows:             document.getElementById('rows'),
      rowTemplate:      document.getElementById('rowTemplate'),
      intervention:     document.getElementById('intervention'),
      interventionChk:  document.getElementById('interventionCheck'),
      interventionAmt:  document.getElementById('interventionAmt'),
      interventionLabel:document.getElementById('interventionLabel'),
      resetBtn:         document.getElementById('resetBtn'),
      readmeLink:       document.getElementById('readmeLink'),
      subtotal:         document.getElementById('subtotal'),
      org:              document.getElementById('org'),
      share:            document.getElementById('share'),
      total:            document.getElementById('total'),
      rateNote:         document.getElementById('rateNote'),
    };

    /* ===== ユーティリティ ===== */
    const yen = n => '¥' + Math.round(n).toLocaleString();
    const pct = r => Math.round(r * 100) + '%';

    function normalizeQty(value) {
      const qty = parseInt(value, 10);
      return (isNaN(qty) || qty < 0) ? 0 : qty;
    }

    // 現在選択中の区分idを取得
    function currentCaseId() {
      const checked = el.caseSelect.querySelector('input[name="case"]:checked');
      return checked ? checked.value : (CASES[0] ? CASES[0].id : '');
    }

    // 現在選択中の区分ラベルを取得
    function currentCaseLabel() {
      const id = currentCaseId();
      const c = CASES.filter(function (c) { return c.id === id; })[0];
      return c ? c.label : '';
    }

    // 商品が現区分で表示対象か（views に現区分idを含むか）
    function isVisible(product, caseId) {
      return product.views.indexOf(caseId) !== -1;
    }

    /* ===== 初期化：データ取得 ===== */
    google.script.run
      .withSuccessHandler(function (data) {
        CASES = data.cases || [];
        PRODUCTS = data.products || [];
        INTERVENTION = data.intervention || INTERVENTION;
        applyTitle(data.title);

        RATE_BY_CASE = {};
        CASES.forEach(function (c) { RATE_BY_CASE[c.id] = c.rate; });

        PRODUCTS.forEach(function (p, i) { QTY[i] = 0; });

        renderCases();
        renderInterventionLabel();
        renderRows();
        update();
      })
      .withFailureHandler(function (err) {
        alert('データ取得に失敗しました: ' + err.message);
      })
      .getData();

    /* ===== readmeリンク ===== */
    function setupReadmeLink() {
      google.script.run
        .withSuccessHandler(function (url) {
          el.readmeLink.href = url + '?page=readme';
        })
        .withFailureHandler(function () {
          el.readmeLink.style.display = 'none';
        })
        .getScriptUrl();
    }

    /* ===== タイトル反映 ===== */
    function applyTitle(title) {
      const t = (title && String(title).trim() !== '') ? String(title) : DEFAULT_TITLE;
      el.appTitle.textContent = t;
      document.title = t;
    }

    /* ===== 描画：区分ラジオ（cases から動的生成）===== */
    function renderCases() {
      const frag = document.createDocumentFragment();
      CASES.forEach(function (c, idx) {
        const node = el.caseTemplate.content.firstElementChild.cloneNode(true);
        const input = node.querySelector('input[name="case"]');
        input.value = c.id;                 // value は id（英字）。日本語はコードに出さない
        if (idx === 0) input.checked = true; // 先頭を初期選択
        node.querySelector('.case-label').textContent = c.label;
        node.querySelector('.case-rate').textContent = pct(c.rate);
        frag.appendChild(node);
      });
      el.caseSelect.innerHTML = '';
      el.caseSelect.appendChild(frag);
    }

    /* ===== 描画：中型介入ラベル・固定額 ===== */
    function renderInterventionLabel() {
      el.interventionLabel.textContent = INTERVENTION.label || '中型介入';
      if (INTERVENTION.enabled) {
        el.interventionAmt.textContent = '請求 ' + yen(INTERVENTION.amount) + ' 固定';
        el.interventionChk.disabled = false;
      } else {
        el.interventionAmt.textContent = '';
        el.interventionChk.disabled = true;
        el.interventionChk.checked = false;
      }
    }

    /* ===== 描画：商品行 ===== */
    function renderRows() {
      const caseId = currentCaseId();
      const frag = document.createDocumentFragment();
      let count = 0;

      PRODUCTS.forEach(function (p, i) {
        if (!isVisible(p, caseId)) return;
        count++;
        const row = el.rowTemplate.content.firstElementChild.cloneNode(true);
        row.querySelector('.name-text').textContent = p.name;
        row.querySelector('.unit-price').textContent = yen(p.price);
        row.querySelector('.price-text').textContent = yen(p.price);
        row.querySelector('.subtotal-cell').id = 'sub-' + i;
        const input = row.querySelector('input[type="number"]');
        input.dataset.index = i;
        input.value = QTY[i];
        frag.appendChild(row);
      });

      el.rows.innerHTML = '';
      if (count === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="4" class="empty-note">表示できる商品がありません</td>';
        el.rows.appendChild(tr);
        return;
      }
      el.rows.appendChild(frag);
    }

    /* ===== 計算 ===== */
    function computeSubtotals() {
      const caseId = currentCaseId();
      const lineSubtotals = {};
      let subtotal = 0;
      PRODUCTS.forEach(function (p, i) {
        if (!isVisible(p, caseId)) return;
        const sub = p.price * (QTY[i] || 0);
        lineSubtotals[i] = sub;
        subtotal += sub;
      });
      return { lineSubtotals, subtotal };
    }

    function computeBilling(subtotal, caseId, useIntervention) {
      const rate = RATE_BY_CASE[caseId] || 0;
      const billing = useIntervention ? INTERVENTION.amount : subtotal;
      const org = billing * rate;
      const share = billing - org;
      return { rate, billing, org, share };
    }

    /* ===== 更新 ===== */
    function update() {
      const caseId = currentCaseId();

      // 中型介入UIは「対象区分 かつ 設定済み」のときのみ表示（id比較。日本語比較は消滅）
      const isInterventionCase = INTERVENTION.enabled && (caseId === INTERVENTION.caseId);
      el.intervention.classList.toggle('show', isInterventionCase);
      if (!isInterventionCase) el.interventionChk.checked = false;
      const useIntervention = isInterventionCase && el.interventionChk.checked;

      const { lineSubtotals, subtotal } = computeSubtotals();
      const { rate, billing, org, share } = computeBilling(subtotal, caseId, useIntervention);

      Object.keys(lineSubtotals).forEach(function (i) {
        const cell = document.getElementById('sub-' + i);
        if (cell) cell.textContent = yen(lineSubtotals[i]);
      });

      el.subtotal.textContent = yen(subtotal);
      el.total.textContent = yen(billing);
      el.org.textContent = yen(org);
      el.share.textContent = yen(share);

      let note = '区分：' + currentCaseLabel() + '（組織入金率 ' + pct(rate) + '）';
      if (useIntervention) note += ' ／ ' + (INTERVENTION.label || '中型介入') + '：請求固定';
      el.rateNote.textContent = note;
    }

    /* ===== 区分変更 ===== */
    function onCaseChange() {
      renderRows();
      update();
    }

    /* ===== リセット ===== */
    function resetForm() {
      PRODUCTS.forEach(function (p, i) { QTY[i] = 0; });
      el.interventionChk.checked = false;
      renderRows();
      update();
    }

    /* ===== 入力フォーカス制御 ===== */
    function onQtyFocus(input) {
      input.dataset.prev = input.value;
      input.value = '';
    }
    function onQtyBlur(input) {
      const i = Number(input.dataset.index);
      if (input.value === '') {
        input.value = (input.dataset.prev != null && input.dataset.prev !== '')
          ? input.dataset.prev
          : 0;
      }
      QTY[i] = normalizeQty(input.value);
      update();
    }

    /* ===== イベント委譲 ===== */
    // 区分ラジオも動的生成のため委譲で受ける
    el.caseSelect.addEventListener('change', function (e) {
      if (e.target.matches('input[name="case"]')) onCaseChange();
    });
    el.interventionChk.addEventListener('change', update);
    el.resetBtn.addEventListener('click', resetForm);

    el.rows.addEventListener('input', function (e) {
      if (e.target.matches('input[type="number"]')) {
        const i = Number(e.target.dataset.index);
        QTY[i] = normalizeQty(e.target.value);
        update();
      }
    });
    el.rows.addEventListener('focusin', function (e) {
      if (e.target.matches('input[type="number"]')) onQtyFocus(e.target);
    });
    el.rows.addEventListener('focusout', function (e) {
      if (e.target.matches('input[type="number"]')) onQtyBlur(e.target);
    });

    /* ===== 起動 ===== */
    setupReadmeLink();
  })();
  </script>
</body>
</html>
